name: UnimoreGo CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Validate dataset schemas and coherence
        run: python tools/validate_data.py

      - name: Run pytest with coverage (>= 90%)
        run: pytest --cov=engine --cov=api --cov-report=term-missing --cov-fail-under=90

  web:
    name: Web (lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Lint (eslint + prettier + tsc)
        run: |
          npm run lint
          npx prettier --check .
          npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
