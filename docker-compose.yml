# Local stack: API on http://localhost:8000, web on http://localhost:3000.
# The browser calls the API directly, so NEXT_PUBLIC_API_URL must be an
# address reachable from the browser and listed in the API's CORS_ORIGINS.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
